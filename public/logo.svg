<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="SitNext">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#23161C"/>
      <stop offset="100%" stop-color="#0D080A"/>
    </linearGradient>
    <!-- One seat per silhouette, reused at six rotations so the ring stays even -->
    <g id="plain">
      <path d="M16.5 6 A3.5 3.5 0 0 1 23.5 6" fill="none" stroke="#F43F5E" stroke-width="1.9" stroke-linecap="round"/>
      <circle cx="20" cy="6" r="2" fill="#F43F5E"/>
    </g>
    <g id="gathered">
      <path d="M16.5 6 A3.5 3.5 0 0 1 23.5 6" fill="none" stroke="#FF8FA3" stroke-width="1.9" stroke-linecap="round"/>
      <circle cx="20" cy="2.9" r="1.1" fill="#FF8FA3"/>
      <circle cx="20" cy="6" r="2" fill="#FF8FA3"/>
    </g>
  </defs>
  <rect width="48" height="48" rx="13" fill="url(#tile)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="12.5" fill="none" stroke="#F43F5E" stroke-opacity="0.35"/>
  <g transform="translate(4 4)">
    <circle cx="20" cy="20" r="8.6" fill="#F43F5E" opacity="0.22"/>
    <circle cx="20" cy="20" r="8.6" fill="none" stroke="#F43F5E" stroke-width="1.9"/>
    <use href="#plain"/>
    <use href="#gathered" transform="rotate(60 20 20)"/>
    <use href="#plain" transform="rotate(120 20 20)"/>
    <use href="#gathered" transform="rotate(180 20 20)"/>
    <use href="#plain" transform="rotate(240 20 20)"/>
    <use href="#gathered" transform="rotate(300 20 20)"/>
  </g>
</svg>
